<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastrar pet · Clyvo Vet</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
<header class="topo"></header>
<main class="conteudo">
    <div id="avisos"></div>

    <div class="titulo-pagina">
        <h1 id="titulo">Cadastrar pet</h1>
    </div>

    <form class="formulario" id="formulario">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" maxlength="50">
        <p class="erro-campo" data-erro="nome"></p>

        <label for="idRaca">Espécie e raça</label>
        <select id="idRaca" name="idRaca"></select>
        <p class="erro-campo" data-erro="idRaca"></p>

        <div class="campos-lado-a-lado">
            <div>
                <label for="idade">Idade (anos)</label>
                <input type="number" id="idade" name="idade" min="0" max="40" placeholder="0 se tiver menos de 1 ano">
                <p class="erro-campo" data-erro="idade"></p>
            </div>
            <div>
                <label for="sexo">Sexo</label>
                <select id="sexo" name="sexo" data-opcoes="F,M"></select>
                <p class="erro-campo" data-erro="sexo"></p>
            </div>
        </div>

        <label for="porte">Porte</label>
        <select id="porte" name="porte" data-opcoes="PEQUENO,MEDIO,GRANDE,SPD"></select>
        <p class="dica-campo">Preenchido pelo porte típico da raça; ajuste se for diferente.</p>
        <p class="erro-campo" data-erro="porte"></p>

        <div class="acoes-formulario">
            <button type="submit" class="botao">Salvar</button>
            <a class="botao botao-secundario" href="pets.html">Cancelar</a>
        </div>
    </form>
</main>
<script src="js/app.js"></script>
<script src="js/pet-form.js"></script>
</body>
</html>
