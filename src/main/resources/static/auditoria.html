<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Auditoria · Clyvo Vet</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
<header class="topo"></header>
<main class="conteudo">
    <div id="avisos"></div>

    <div class="titulo-pagina">
        <div>
            <h1>Auditoria do banco</h1>
            <p class="subtitulo">Operações em pacientes registradas pela trigger TRG_CT_AUDITORIA_PACIENTE e erros registrados
                pelas procedures em TB_CT_LOG_ERRO.</p>
        </div>
        <a class="botao botao-secundario" href="h2-console" target="_blank" rel="noopener">Abrir console do banco</a>
    </div>

    <div class="abas" role="tablist">
        <button type="button" class="aba ativa" role="tab" aria-selected="true" data-aba="operacoes">Operações em pacientes</button>
        <button type="button" class="aba" role="tab" aria-selected="false" data-aba="erros">Erros das procedures</button>
    </div>

    <div id="lista"></div>
    <div class="paginacao" id="paginacao"></div>
</main>
<script src="js/app.js"></script>
<script src="js/auditoria.js"></script>
</body>
</html>
