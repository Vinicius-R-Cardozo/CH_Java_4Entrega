<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Relatórios · Clyvo Vet</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
<header class="topo"></header>
<main class="conteudo">
    <div id="avisos"></div>

    <div class="titulo-pagina">
        <div>
            <h1>Relatórios</h1>
            <p class="subtitulo">Gerados pelas procedures do PKG_CT_RELATORIOS no banco da clínica.</p>
        </div>
    </div>

    <h2>Pets por tutor</h2>
    <p class="subtitulo">PRC_CT_BUSCA_PETS_POR_TUTOR</p>
    <form class="formulario formulario-em-linha" id="form-tutor">
        <div>
            <label for="idTutor">Tutor</label>
            <select id="idTutor" name="idTutor"></select>
        </div>
        <div class="acoes-formulario">
            <button type="submit" class="botao">Ver pets</button>
        </div>
    </form>
    <div id="pets-do-tutor"></div>

    <h2>Soma de idades por faixa e porte</h2>
    <p class="subtitulo">PRC_CT_RESUMO_IDADE_PORTE — mesma saída que o DBMS_OUTPUT mostraria no Oracle.</p>
    <form class="formulario formulario-em-linha" id="form-resumo">
        <div>
            <label for="faixa">Faixa etária</label>
            <select id="faixa" name="faixa">
                <option value="">Todas</option>
                <option value="FILHOTE/JOVEM">Filhote/Jovem (até 2 anos)</option>
                <option value="ADULTO">Adulto (3 a 8 anos)</option>
                <option value="IDOSO">Idoso (9 anos ou mais)</option>
            </select>
        </div>
        <div>
            <label for="porte">Porte</label>
            <select id="porte" name="porte">
                <option value="">Todos</option>
                <option value="PEQUENO">Pequeno</option>
                <option value="MEDIO">Médio</option>
                <option value="GRANDE">Grande</option>
                <option value="SPD">Sem porte definido</option>
            </select>
        </div>
        <div class="acoes-formulario">
            <button type="submit" class="botao">Gerar relatório</button>
        </div>
    </form>
    <pre class="saida-console" id="resumo" hidden></pre>
</main>
<script src="js/app.js"></script>
<script src="js/relatorios.js"></script>
</body>
</html>
