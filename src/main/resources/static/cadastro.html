<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Criar conta · Clyvo Vet</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body class="pagina-login">
<main class="cartao-login cartao-cadastro">
    <h1 class="marca">Clyvo Vet</h1>
    <p class="subtitulo">Crie sua conta de tutor para acompanhar a carteira de cuidados dos seus pets.</p>

    <div id="avisos"></div>

    <form class="formulario" id="formulario">
        <fieldset>
            <legend>Seus dados</legend>
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" name="nome" maxlength="50" autocomplete="name">
            <p class="erro-campo" data-erro="nome"></p>

            <div class="campos-lado-a-lado">
                <div>
                    <label for="cpf">CPF (só números)</label>
                    <input type="text" id="cpf" name="cpf" inputmode="numeric" maxlength="11">
                    <p class="erro-campo" data-erro="cpf"></p>
                </div>
                <div>
                    <label for="sexo">Sexo</label>
                    <select id="sexo" name="sexo" data-opcoes="F,M"></select>
                    <p class="erro-campo" data-erro="sexo"></p>
                </div>
            </div>

            <label for="telefone">Celular com DDD (só números)</label>
            <input type="tel" id="telefone" name="telefone" inputmode="numeric" maxlength="11" autocomplete="tel">
            <p class="erro-campo" data-erro="telefone"></p>
        </fieldset>

        <fieldset>
            <legend>Acesso</legend>
            <label for="email">E-mail (é o seu login)</label>
            <input type="email" id="email" name="email" maxlength="50" autocomplete="email">
            <p class="erro-campo" data-erro="email"></p>

            <div class="campos-lado-a-lado">
                <div>
                    <label for="login">Apelido de usuário</label>
                    <input type="text" id="login" name="login" maxlength="10">
                    <p class="erro-campo" data-erro="login"></p>
                </div>
                <div>
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" maxlength="40" autocomplete="new-password">
                    <p class="erro-campo" data-erro="senha"></p>
                </div>
            </div>
        </fieldset>

        <fieldset>
            <legend>Endereço</legend>
            <div class="campos-lado-a-lado">
                <div>
                    <label for="cep">CEP (só números)</label>
                    <input type="text" id="cep" name="cep" inputmode="numeric" maxlength="8" autocomplete="postal-code">
                    <p class="erro-campo" data-erro="cep"></p>
                </div>
                <div>
                    <label for="numero">Número</label>
                    <input type="number" id="numero" name="numero" min="1">
                    <p class="erro-campo" data-erro="numero"></p>
                </div>
            </div>

            <label for="logradouro">Rua</label>
            <input type="text" id="logradouro" name="logradouro" maxlength="100" autocomplete="address-line1">
            <p class="erro-campo" data-erro="logradouro"></p>

            <label for="complemento">Complemento (opcional)</label>
            <input type="text" id="complemento" name="complemento" maxlength="50" autocomplete="address-line2">
            <p class="erro-campo" data-erro="complemento"></p>

            <div class="campos-lado-a-lado">
                <div>
                    <label for="cidade">Cidade</label>
                    <input type="text" id="cidade" name="cidade" maxlength="60" autocomplete="address-level2">
                    <p class="erro-campo" data-erro="cidade"></p>
                </div>
                <div>
                    <label for="uf">UF</label>
                    <select id="uf" name="uf"></select>
                    <p class="erro-campo" data-erro="uf"></p>
                </div>
            </div>
        </fieldset>

        <div class="acoes-formulario">
            <button type="submit" class="botao">Criar conta</button>
            <a class="botao botao-secundario" href="index.html">Já tenho conta</a>
        </div>
    </form>
</main>
<script src="js/app.js"></script>
<script src="js/cadastro.js"></script>
</body>
</html>
