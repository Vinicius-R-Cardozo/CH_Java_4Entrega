spring.application.name=clyvo-vet
server.port=${PORT:8080}

# H2 em arquivo no modo Oracle: aceita o DDL do banco do grupo (VARCHAR2, sequences, DUAL, CURRVAL).
spring.datasource.url=jdbc:h2:file:${DB_PATH:./data/clyvovet};MODE=Oracle;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

# Quem cria e altera as tabelas é o Flyway. O Hibernate não valida o esquema porque o DDL do grupo
# usa INTEGER e CHAR, e as entidades usam Long e String; os testes de integração cobrem esse mapeamento.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Console do H2 (só para o perfil VETERINARIO): é por ele que mostramos os SELECTs no vídeo.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
